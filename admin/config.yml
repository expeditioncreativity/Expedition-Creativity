backend:
  name: github
  repo: expeditioncreativity/Expedition-Creativity
  branch: main
  base_url: https://api.netlify.com
  auth_endpoint: auth
  site_domain: expeditioncreativity.netlify.app
  preview_context: netlify/expeditioncreativity/deploy-preview
locale: nl
media_folder: src/assets/uploads
public_folder: /assets/uploads
site_url: https://expeditioncreativity.com
display_url: https://expeditioncreativity.com
logo_url: /assets/logo-original.png
collections:
- name: tracks
  label: Composities — Nederlands
  label_singular: Compositie
  preview_path: nl/composities/{{slug}}/
  folder: content/tracks
  format: json
  extension: json
  create: true
  delete: false
  slug: '{{fields.slug}}'
  identifier_field: title
  summary: '{{title}} · {{fields.year}} · {{status}}'
  filter:
    field: approved
    value: false
  editor:
    preview: true
  description: "Nederlandstalige composities. Opslaan publiceert rechtstreeks na de build. Gebruik status concept om een nieuwe compositie verborgen te houden. Engels wordt afzonderlijk beheerd. Blue Boy Planet is beschermd."
  fields:
  - label: Titel
    name: title
    widget: string
    hint: 1. Basisinformatie — gedeelde gegevens voor beide talen.
  - label: URL-naam
    name: slug
    widget: string
    pattern:
    - ^[a-z0-9]+(-[a-z0-9]+)*$
    - Gebruik kleine letters, cijfers en koppeltekens.
  - label: Jaar
    name: year
    widget: number
    value_type: int
    min: 1900
    max: 2200
  - label: Uitgavemaand (1–12)
    name: release_month
    widget: number
    value_type: int
    min: 1
    max: 12
    required: false
  - label: Duurtijd
    name: duration
    widget: string
    required: false
    pattern:
    - ^[0-9]+:[0-5][0-9]$
    - Gebruik m:ss, bijvoorbeeld 4:41.
  - label: Wereld
    name: world
    widget: string
    hint: 'NL: Natuur/Oceaan/Ruimte/Oorsprong/Migratie/Old West. EN: Nature/Ocean/Space/Origins/Migration/Old West.'
  - label: Genre
    name: type
    widget: string
    hint: Gebruik de taal van deze collectie.
  - label: YouTube-video-ID
    name: video_id
    widget: string
    pattern:
    - ^[A-Za-z0-9_-]{11}$
    - Vul alleen het video-ID van 11 tekens in.
  - label: Hoesafbeelding
    name: image
    widget: image
  - label: Inleiding
    name: intro
    widget: markdown
    required: false
    minimal: false
    buttons:
    - bold
    - italic
    - strikethrough
    - heading-three
    - heading-four
    - heading-five
    - heading-six
    - bulleted-list
    - numbered-list
    - quote
    - link
    - code
    editor_components: []
  - label: 2. Het verhaal achter de muziek
    name: story
    widget: markdown
    required: false
    minimal: false
    buttons:
    - bold
    - italic
    - strikethrough
    - heading-three
    - heading-four
    - heading-five
    - heading-six
    - bulleted-list
    - numbered-list
    - quote
    - link
    - code
    editor_components: []
  - label: 3. De muzikale reis
    name: journey
    widget: markdown
    required: false
    minimal: false
    buttons:
    - bold
    - italic
    - strikethrough
    - heading-three
    - heading-four
    - heading-five
    - heading-six
    - bulleted-list
    - numbered-list
    - quote
    - link
    - code
    editor_components: []
  - label: 4. Orkestratie — toelichting
    name: orchestration
    widget: markdown
    required: false
    minimal: false
    buttons:
    - bold
    - italic
    - strikethrough
    - heading-three
    - heading-four
    - heading-five
    - heading-six
    - bulleted-list
    - numbered-list
    - quote
    - link
    - code
    editor_components: []
  - label: Instrumentatie
    name: instrumentation
    widget: markdown
    required: false
    minimal: false
    buttons:
    - bold
    - italic
    - strikethrough
    - heading-three
    - heading-four
    - heading-five
    - heading-six
    - bulleted-list
    - numbered-list
    - quote
    - link
    - code
    editor_components: []
    hint: 5. Compositiegegevens verschijnen automatisch op basis van de basisinformatie; geen dubbele invoer.
  - name: performance
    label: 6. Partituren & uitvoering
    widget: object
    collapsed: false
    required: false
    default:
      availability: unspecified
      body: ''
      contact_cta: false
    fields:
    - name: availability
      label: Beschikbaarheid
      widget: select
      default: unspecified
      options:
      - label: Niet vermeld
        value: unspecified
      - label: Op aanvraag
        value: on_request
      - label: Niet beschikbaar
        value: unavailable
      required: false
    - label: Toelichting
      name: body
      widget: markdown
      required: false
      minimal: false
      buttons:
      - bold
      - italic
      - strikethrough
      - heading-three
      - heading-four
      - heading-five
      - heading-six
      - bulleted-list
      - numbered-list
      - quote
      - link
      - code
      editor_components: []
    - name: contact_cta
      label: Contactknop tonen
      widget: boolean
      default: false
      required: false
      hint: Geen automatische claims over partijen of live-uitvoeringen.
  - label: 7. Achter de partituur
    name: behind
    widget: markdown
    required: false
    minimal: false
    buttons:
    - bold
    - italic
    - strikethrough
    - heading-three
    - heading-four
    - heading-five
    - heading-six
    - bulleted-list
    - numbered-list
    - quote
    - link
    - code
    editor_components: []
  - name: gallery
    label: Afbeeldingen achter de partituur
    widget: list
    required: false
    summary: '{{fields.caption}}'
    fields:
    - name: image
      label: Afbeelding
      widget: image
    - name: alt
      label: Alt-tekst
      widget: string
      hint: Beschrijf wat op de afbeelding te zien is.
    - name: caption
      label: Onderschrift
      widget: string
      required: false
  - label: 8. Ontdek meer muziek
    name: related
    widget: relation
    collection: track_choices
    search_fields:
    - title
    - slug
    value_field: slug
    display_fields:
    - title
    multiple: true
    required: false
  - label: 9. SEO-titel
    name: seo_title
    widget: string
    required: false
  - label: Korte beschrijving voor zoekmachines
    name: description
    widget: text
    required: false
  - name: og_image
    label: Afbeelding bij delen (optioneel)
    widget: image
    required: false
    hint: Zonder keuze wordt de cover gebruikt.
  - label: Status
    name: status
    widget: select
    options:
    - label: Concept
      value: draft
    - label: Zichtbaar na publiceren
      value: published
    default: draft
  - name: content_version
    widget: hidden
    default: 2
    required: false
  - name: section_meta
    widget: hidden
    default: {}
    required: false
  - name: section_order
    widget: hidden
    default: []
    required: false
  - name: legacy_sections
    widget: hidden
    default: []
    required: false
  - name: approved
    widget: hidden
    default: false
