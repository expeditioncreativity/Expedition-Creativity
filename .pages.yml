# GitHub-hosted editorial CMS. Open app.pagescms.org, select the development branch.
media:
  input: studio/media
  output: /media
  categories: [image]
  extensions: [png, jpg, jpeg, webp]
  rename: safe
content:
  - name: tracks-nl
    label: Composities (Nederlands)
    type: collection
    path: content/tracks/nl
    format: json
    filename: "{slug}.json"
    view:
      primary: title
      fields: [title, status, year, genre]
      sort: [title, year]
      search: [title, genre]
    fields:
      - name: title
        label: Compositietitel
        type: string
        required: true
      - name: slug
        label: Slug (zonder track-)
        type: string
        required: true
        pattern: "^[a-z0-9]+(-[a-z0-9]+)*$"
      - name: locale
        label: Taal
        type: select
        options:
          values: [{name: nl-BE, label: Nederlands (België)}]
      - name: status
        label: Redactionele status
        type: select
        options:
          values: [{name: draft, label: Concept}, {name: published, label: Goedgekeurd}]
      - name: composer
        label: Componist
        type: string
      - name: year
        label: Jaar
        type: number
      - name: duration
        label: Duur (mm:ss)
        type: string
      - name: genre
        label: Genre
        type: string
      - name: eyebrow
        label: Korte typering boven de titel
        type: string
      - name: intro
        label: Korte introductie
        type: rich-text
        options: {format: markdown}
      - name: story
        label: Het verhaal achter de muziek
        type: rich-text
        options: {format: markdown}
      - name: journey
        label: De muzikale reis
        type: rich-text
        options: {format: markdown}
      - name: orchestration
        label: Orkestratie
        type: rich-text
        options: {format: markdown}
      - name: instrumentation
        label: Instrumentatie
        type: rich-text
        options: {format: markdown}
      - name: performance
        label: Partituren en uitvoering (optioneel)
        type: rich-text
        options: {format: markdown}
      - name: score_available
        label: Partituur beschikbaar op aanvraag
        type: boolean
      - name: hero_image
        label: Artwork / hero
        type: image
      - name: youtube_id
        label: YouTube video-ID (11 tekens)
        type: string
      - name: gallery
        label: "Achter de partituur: galerij"
        type: object
        list: true
        fields:
          - {name: image, label: Afbeelding, type: image}
          - {name: alt, label: Alt-tekst, type: string}
          - {name: caption, label: Bijschrift, type: string}
      - name: related
        label: Ontdek meer muziek
        type: object
        list: true
        fields:
          - {name: title, label: Titel, type: string}
          - {name: slug, label: Slug, type: string}
          - {name: youtube_id, label: YouTube video-ID, type: string}
      - name: seo_title
        label: SEO-paginatitel
        type: string
      - name: seo_description
        label: Meta description
        type: text

  - name: site-nl
    label: Home en navigatie (Nederlands)
    type: file
    path: content/site/nl.json
    format: json
    fields:
      - {name: locale, label: Taal, type: string, readonly: true}
      - {name: site_name, label: Website, type: string}
      - {name: home_kicker, label: Label boven de titel, type: string}
      - {name: home_title, label: Home titel, type: string}
      - {name: home_intro, label: Home introductie, type: text}
      - {name: home_featured_title, label: Titel uitgelichte composities, type: string}
      - {name: home_featured_intro, label: Introductie uitgelichte composities, type: text}
      - {name: home_about_title, label: Titel achter de muziek, type: string}
      - {name: home_about_intro, label: Introductie achter de muziek, type: text}
      - {name: home_seo_title, label: Home SEO titel, type: string}
      - {name: home_seo_description, label: Home meta-omschrijving, type: text}
      - {name: tracks_title, label: Titel trackoverzicht, type: string}
      - {name: tracks_intro, label: Trackoverzicht intro, type: text}
      - {name: tracks_seo_title, label: Tracks SEO titel, type: string}
      - {name: tracks_seo_description, label: Tracks meta-omschrijving, type: text}

  - name: track-catalogue
    label: Catalogus & volgorde (nog in ontwikkeling)
    type: file
    path: content/site/catalogue.json
    format: json
    fields:
      - name: tracks
        label: Composities in catalogus
        type: object
        list: true
        fields:
          - {name: title, label: Titel, type: string}
          - {name: slug, label: URL-sleutel, type: string}
          - {name: year, label: Jaar, type: number}
          - {name: youtube_id, label: YouTube video-ID, type: string}
          - {name: world, label: Wereld of thema, type: string}
          - {name: type, label: Muziektype, type: string}

  # Nederlandstalige redactionele pagina's. Deze records leveren de reviewpagina's.
  - name: about-nl
    label: Mijn verhaal (Nederlands)
    type: file
    path: content/site/over_nl.json
    format: json
    fields:
      - {name: eyebrow, label: Bovenregel, type: string}
      - {name: title, label: Paginatitel, type: string}
      - {name: intro, label: Introductie, type: text}
      - {name: story_heading, label: Subkop muzikale reis, type: string}
      - {name: story, label: Mijn muzikale reis, type: rich-text, options: {format: markdown}}
      - {name: purpose_heading, label: Subkop doelgroepen, type: string}
      - {name: purpose, label: "Voor wie componeer ik?", type: rich-text, options: {format: markdown}}
      - {name: quote, label: Persoonlijk citaat, type: string}
      - {name: seo_title, label: SEO-titel, type: string}
      - {name: seo_description, label: Meta-omschrijving, type: text}
  - name: timeline-nl
    label: Tijdlijn (Nederlands)
    type: file
    path: content/site/tijdlijn_nl.json
    format: json
    fields:
      - {name: eyebrow, label: Bovenregel, type: string}
      - {name: title, label: Paginatitel, type: string}
      - {name: intro, label: Introductie, type: text}
      - {name: note, label: Publicatienotitie, type: text}
      - {name: seo_title, label: SEO-titel, type: string}
      - {name: seo_description, label: Meta-omschrijving, type: text}
  - name: behind-nl
    label: Achter de muziek (Nederlands)
    type: file
    path: content/site/achter_nl.json
    format: json
    fields:
      - {name: eyebrow, label: Bovenregel, type: string}
      - {name: title, label: Paginatitel, type: string}
      - {name: intro, label: Introductie, type: text}
      - {name: process_heading, label: Subkop proces, type: string}
      - {name: process, label: Creatief proces, type: rich-text, options: {format: markdown}}
      - {name: tools_heading, label: Subkop gereedschap, type: string}
      - {name: tools, label: Gebruikte software en bibliotheken, type: rich-text, options: {format: markdown}}
      - {name: gallery_heading, label: Galerijtitel, type: string}
      - {name: gallery_intro, label: Galerij-intro, type: text}
      - {name: seo_title, label: SEO-titel, type: string}
      - {name: seo_description, label: Meta-omschrijving, type: text}
  - name: contact-nl
    label: Contact (Nederlands)
    type: file
    path: content/site/contact_nl.json
    format: json
    fields:
      - {name: eyebrow, label: Bovenregel, type: string}
      - {name: title, label: Paginatitel, type: string}
      - {name: intro, label: Introductie, type: text}
      - {name: email, label: E-mail, type: string}
      - {name: youtube, label: YouTube-link, type: string}
      - {name: linkedin, label: LinkedIn-link, type: string}
      - {name: score_heading, label: Partituren subkop, type: string}
      - {name: score_body, label: Partituren informatie, type: rich-text, options: {format: markdown}}
      - {name: collaboration_heading, label: Samenwerking subkop, type: string}
      - {name: collaboration_body, label: Samenwerking informatie, type: rich-text, options: {format: markdown}}
      - {name: seo_title, label: SEO-titel, type: string}
      - {name: seo_description, label: Meta-omschrijving, type: text}
  - name: cookies-nl
    label: Cookiebeleid (Nederlandse ontwerptekst)
    type: file
    path: content/site/cookies_nl.json
    format: json
    fields:
      - {name: eyebrow, label: Bovenregel, type: string}
      - {name: title, label: Paginatitel, type: string}
      - {name: intro, label: Introductie, type: text}
      - {name: body, label: Inhoud - te controleren voor publicatie, type: rich-text, options: {format: markdown}}
      - {name: seo_title, label: SEO-titel, type: string}
      - {name: seo_description, label: Meta-omschrijving, type: text}