[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"

# The existing production branch and domain settings are managed in Netlify.
# This development branch does not change them or publish to production.

# Takes effect only after an explicitly approved production release.
[context.production.environment]
  SITE_MODE = "production"

# Only existing cover URLs; the CDN fetches them server-side.
[images]
  remote_images = ['https://i\.ytimg\.com/vi/[A-Za-z0-9_-]{11}/(hqdefault|maxresdefault)\.jpg']
